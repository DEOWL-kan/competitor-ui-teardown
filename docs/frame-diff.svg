<svg xmlns="http://www.w3.org/2000/svg" width="568" height="517" viewBox="0 0 568 517" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
<rect width="568" height="517" rx="8" fill="#0d1117"/>
<rect width="568" height="28" rx="8" fill="#161b22"/>
<rect y="20" width="568" height="8" fill="#161b22"/>
<circle cx="24" cy="14" r="5.5" fill="#ff5f56"/>
<circle cx="39" cy="14" r="5.5" fill="#ffbd2e"/>
<circle cx="54" cy="14" r="5.5" fill="#27c93f"/>
<text x="284.0" y="18.5" fill="#8b949e" font-size="11.5" text-anchor="middle">frame_diff.py — motion rhythm, measured against a known answer</text>
<text x="18" y="52.0" fill="#c9d1d9" xml:space="preserve">$ python3 scripts/frame_diff.py rec.mp4 --no-plot</text>
<text x="18" y="69.0" fill="#8b949e" xml:space="preserve"># rec.mp4</text>
<text x="18" y="86.0" fill="#c9d1d9" xml:space="preserve">  1080x1920  13.53s</text>
<text x="18" y="103.0" fill="#c9d1d9" xml:space="preserve">  271 frames sampled at 20 fps, analysed at 108x120</text>
<text x="18" y="120.0" fill="#c9d1d9" xml:space="preserve">  variable frame rate: header says 30 fps, file averages 16.3</text>
<text x="18" y="137.0" fill="#c9d1d9" xml:space="preserve">  (screenrecord emits a frame only when the screen changes — this is</text>
<text x="18" y="154.0" fill="#c9d1d9" xml:space="preserve">   information about the recording, not an error)</text>
<text x="18" y="188.0" fill="#c9d1d9" xml:space="preserve">  2 of 270 samples (0.7%) fall below the quiet</text>
<text x="18" y="205.0" fill="#c9d1d9" xml:space="preserve">  threshold while both neighbours are moving.</text>
<text x="18" y="222.0" fill="#c9d1d9" xml:space="preserve">  (isolated — below the level that distorts segmentation)</text>
<text x="18" y="256.0" fill="#79c0ff" xml:space="preserve">## Segments (quiet = delta &lt;= 0.1)</text>
<text x="18" y="273.0" fill="#c9d1d9" xml:space="preserve">  quiet   0.05 -&gt;   1.90   (1.85s)</text>
<text x="18" y="290.0" fill="#c9d1d9" xml:space="preserve">  move    1.90 -&gt;   4.10   (2.20s)</text>
<text x="18" y="307.0" fill="#c9d1d9" xml:space="preserve">  quiet   4.10 -&gt;   6.15   (2.05s)</text>
<text x="18" y="324.0" fill="#c9d1d9" xml:space="preserve">  move    6.15 -&gt;   8.25   (2.10s)</text>
<text x="18" y="341.0" fill="#c9d1d9" xml:space="preserve">  quiet   8.25 -&gt;  10.15   (1.90s)</text>
<text x="18" y="358.0" fill="#c9d1d9" xml:space="preserve">  move   10.15 -&gt;  12.45   (2.30s)</text>
<text x="18" y="375.0" fill="#c9d1d9" xml:space="preserve">  quiet  12.45 -&gt;  13.50   (1.05s)</text>
<text x="18" y="409.0" fill="#c9d1d9" xml:space="preserve">  static segments: 4, mean 1.71s</text>
<text x="18" y="426.0" fill="#c9d1d9" xml:space="preserve">  moving segments: 3, mean 2.20s</text>
<text x="18" y="443.0" fill="#c9d1d9" xml:space="preserve">  cycle length:    mean 4.13s  ['4.05', '4.15', '4.20']</text>
<text x="18" y="477.0" fill="#8b949e" xml:space="preserve"># ground truth — this clip was generated, so the answer is known:</text>
<text x="18" y="494.0" fill="#8b949e" xml:space="preserve">#   hold 1.50s + eased crossfade 2.70s, looping. cycle = 4.20s</text>
</svg>